name: Validate Project Slice Method

on:
  pull_request:
    paths:
      - "planning/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/hooks/**"
      - ".github/prompts/**"
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "scripts/psm/**"
  push:
    branches:
      - main
    paths:
      - "planning/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/hooks/**"
      - ".github/prompts/**"
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "scripts/psm/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/psm/validate_psm.py validate . --all --strict