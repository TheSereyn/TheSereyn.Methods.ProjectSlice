name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Resolve publish metadata
        id: release
        run: |
          node scripts/psm/release_publish.mjs \
            --tag "${{ github.event.release.tag_name }}" \
            --prerelease "${{ github.event.release.prerelease }}" \
            --repository-url "${{ github.server_url }}/${{ github.repository }}.git" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Dry-run the package tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --tag "${{ steps.release.outputs.dist_tag }}" --access public

      - name: Show live dist-tags
        continue-on-error: true
        run: npm dist-tag ls "${{ steps.release.outputs.package_name }}"

      - name: Write publish summary
        run: |
          {
            echo "## npm publish"
            echo
            echo "- Package: \`${{ steps.release.outputs.package_name }}\`"
            echo "- npm version: \`${{ steps.release.outputs.package_version }}\`"
            echo "- Release tag: \`${{ steps.release.outputs.release_tag }}\`"
            echo "- Dist-tag: \`${{ steps.release.outputs.dist_tag }}\`"
            echo "- Install command: \`${{ steps.release.outputs.install_command }}\`"
          } >> "$GITHUB_STEP_SUMMARY"